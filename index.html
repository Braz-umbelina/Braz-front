<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark has no outline, so one colour always vanishes against the browser
    chrome. The first line is the fallback for whoever ignores the media attribute. -->
    <link rel="icon" type="image/png" href="/images/icone-braz-512.png" />
    <link rel="icon" type="image/png" href="/images/icone-braz-512.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/images/icone-branco-512.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Braz - Assistente Educacional</title>

    <!-- Turns "adicionar à tela de início" num app: ícone, splash e barra de status
    próprios em vez do navegador comum. -->
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A0F1C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Braz" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
              display: ['Poppins', 'sans-serif'],
            },
            colors: {
              brand: {
                preto: '#080C16',
                fundo: '#0A0F1C',
                acao: '#FFFFFF',
                destaque: '#4BC52F',
                amarelo: '#FABC17',
                ocre: '#8A6200',
                elo: '#2B4F8F',
                eloClaro: '#7FA8E8',
                light: '#EDEDED',
                cinza: '#8A8A8A',
                superficie: '#141414',
                elevada: '#1C1C1C',
                claro: '#EEF2F6',
                tinta: '#16233A',
                painel: '#141F35',
                mata: '#123A2C',
              },
            },
          },
        },
      }
    </script>
    <script>
      // runs before react so the screen never flashes in the wrong theme
      var escuro = localStorage.getItem('braz:tema') !== 'claro'
      document.documentElement.classList.toggle('dark', escuro)
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', escuro ? '#0A0F1C' : '#EEF2F6')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
